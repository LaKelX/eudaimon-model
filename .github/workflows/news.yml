name: Refresh news tape
on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: true
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch crypto + macro headlines
        run: python3 data/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "eudaimon-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet && exit 0
          git commit -m "News tape $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
