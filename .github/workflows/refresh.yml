name: Refresh reality data
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FRED, World Bank, UNDP
        run: python3 data/fetch_reality.py
      - name: Commit if changed
        run: |
          git config user.name "eudaimon-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reality.json
          git diff --cached --quiet || (git commit -m "Reality data refresh $(date -u +%Y-%m-%d)" && git push)
